site_name: HarnMaster 3.5E Ruleset
site_description: Documentation for HarnMaster 3.5E on Fantasy Grounds Unity
site_author: Mephisto
site_url: https://fgmephisto.github.io/HarnMasterPublic/
repo_url: https://github.com/FGMephisto/HarnMasterPublic
repo_name: FGMephisto/HarnMasterPublic

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Manual: user-manual.md
  - Combat Resolution: combat-resolution.md
  - Status Effects & Conditions: status-effects-reference.md
